name: BodaBoda Digital CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # TASK 2: CONTINUOUS INTEGRATION
  # ============================================================
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bodaboda_test
          MYSQL_USER: bodaboda_user
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql, bcmath, gd, zip
          coverage: xdebug
          tools: composer

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure Database Environment
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=bodaboda_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -proot bodaboda_test -e "SELECT 1" &> /dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Attempt $i: Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Database
        run: |
          php artisan key:generate
          php artisan config:cache
          php artisan migrate --force
          php artisan db:seed --force

      - name: Create storage links
        run: php artisan storage:link

      - name: Run Tests
        run: php artisan test

      - name: Run API Tests
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          curl -v http://127.0.0.1:8000/ || true
          kill $SERVER_PID || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v1,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Security Scan
        run: |
          composer require --dev enlightn/security-checker
          vendor/bin/security-checker security:check

      - name: Upload test results and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            storage/logs/
            coverage/
            /tmp/laravel.log
          retention-days: 30

  # ============================================================
  # TASK 3: STAGING DEPLOYMENT
  # ============================================================
  deploy-staging:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Pull latest app image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create Docker network
        run: docker network create bodaboda-staging-net 2>/dev/null || true

      - name: Start MySQL for staging
        run: |
          docker stop bodaboda-staging-db 2>/dev/null || true
          docker rm bodaboda-staging-db 2>/dev/null || true
          docker run -d \
            --name bodaboda-staging-db \
            --network bodaboda-staging-net \
            -e MYSQL_DATABASE=bodaboda \
            -e MYSQL_USER=bodaboda_user \
            -e MYSQL_PASSWORD=root \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec bodaboda-staging-db mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 3
          done

      - name: Start app container (php-fpm)
        run: |
          docker stop bodaboda-staging-app 2>/dev/null || true
          docker rm bodaboda-staging-app 2>/dev/null || true
          docker run -d \
            --name bodaboda-staging-app \
            --network bodaboda-staging-net \
            -e APP_ENV=staging \
            -e APP_DEBUG=true \
            -e APP_KEY=${{ secrets.APP_KEY }} \
            -e APP_URL=http://localhost:8080 \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=bodaboda-staging-db \
            -e DB_PORT=3306 \
            -e DB_DATABASE=bodaboda \
            -e DB_USERNAME=bodaboda_user \
            -e DB_PASSWORD=root \
            -e CACHE_DRIVER=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 5

          # Fix storage permissions before running artisan
          docker exec -u root bodaboda-staging-app bash -c "
            mkdir -p storage/logs storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache &&
            chmod -R 777 storage bootstrap/cache &&
            chown -R www-data:www-data storage bootstrap/cache
          "

          docker exec bodaboda-staging-app php artisan migrate --force || true
          docker exec bodaboda-staging-app php artisan storage:link || true

      - name: Start nginx for staging
        run: |
          mkdir -p /tmp/nginx-staging
          cat > /tmp/nginx-staging/default.conf << 'NGINXCONF'
          server {
              listen 80;
              index index.php index.html;
              root /var/www/public;
              location ~ \.php$ {
                  try_files $uri =404;
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass bodaboda-staging-app:9000;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param PATH_INFO $fastcgi_path_info;
              }
              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }
          }
          NGINXCONF
          docker stop bodaboda-staging-nginx 2>/dev/null || true
          docker rm bodaboda-staging-nginx 2>/dev/null || true
          docker run -d \
            --name bodaboda-staging-nginx \
            --network bodaboda-staging-net \
            -p 8080:80 \
            -v /tmp/nginx-staging/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine

      - name: Verify Staging is running
        run: |
          echo "Verifying staging deployment..."
          sleep 10

          if docker ps | grep -q bodaboda-staging-nginx; then
            echo "Nginx container is running"
          else
            echo "Nginx container failed to start"
            docker logs bodaboda-staging-nginx --tail 30 || true
            exit 1
          fi

          if docker ps | grep -q bodaboda-staging-app; then
            echo "App container is running"
          else
            echo "App container failed to start"
            docker logs bodaboda-staging-app --tail 30 || true
            exit 1
          fi

          if docker ps | grep -q bodaboda-staging-db; then
            echo "Database container is running"
          else
            echo "Database container failed to start"
            exit 1
          fi

          echo "============================================"
          echo "  STAGING DEPLOYMENT SUCCESSFUL"
          echo "  Environment : STAGING"
          echo "  App URL     : http://localhost:8080"
          echo "  Containers  : 3 running"
          echo "  Status      : HEALTHY"
          echo "============================================"

      - name: Collect staging logs
        if: always()
        run: |
          echo "========== STAGING LOGS =========="
          echo "--- Running containers ---"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
          echo "--- App logs ---"
          docker logs bodaboda-staging-app --tail 30 || true
          echo "--- Nginx logs ---"
          docker logs bodaboda-staging-nginx --tail 20 || true
          echo "--- Docker images ---"
          docker images | grep bodaboda || true

  # ============================================================
  # TASK 3: APPROVAL GATE
  # ============================================================
  approval-gate:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-approval
    steps:
      - name: Awaiting Release Manager Approval
        run: |
          echo "========================================"
          echo "  STAGING VERIFIED SUCCESSFULLY"
          echo "  Waiting for Release Manager approval"
          echo "  before deploying to PRODUCTION..."
          echo "========================================"

  # ============================================================
  # TASK 3: PRODUCTION DEPLOYMENT
  # ============================================================
  deploy-production:
    needs: approval-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Pull latest app image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Create Docker network
        run: docker network create bodaboda-prod-net 2>/dev/null || true

      - name: Start MySQL for production
        run: |
          docker stop bodaboda-prod-db 2>/dev/null || true
          docker rm bodaboda-prod-db 2>/dev/null || true
          docker run -d \
            --name bodaboda-prod-db \
            --network bodaboda-prod-net \
            -e MYSQL_DATABASE=bodaboda \
            -e MYSQL_USER=bodaboda_user \
            -e MYSQL_PASSWORD=root \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec bodaboda-prod-db mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 3
          done

      - name: Start app container (php-fpm)
        run: |
          docker stop bodaboda-prod-app 2>/dev/null || true
          docker rm bodaboda-prod-app 2>/dev/null || true
          docker run -d \
            --name bodaboda-prod-app \
            --network bodaboda-prod-net \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY=${{ secrets.APP_KEY }} \
            -e APP_URL=http://localhost:8000 \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=bodaboda-prod-db \
            -e DB_PORT=3306 \
            -e DB_DATABASE=bodaboda \
            -e DB_USERNAME=bodaboda_user \
            -e DB_PASSWORD=root \
            -e CACHE_DRIVER=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 5

          # Fix storage permissions before running artisan
          docker exec -u root bodaboda-prod-app bash -c "
            mkdir -p storage/logs storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache &&
            chmod -R 777 storage bootstrap/cache &&
            chown -R www-data:www-data storage bootstrap/cache
          "

          docker exec bodaboda-prod-app php artisan migrate --force
          docker exec bodaboda-prod-app php artisan config:cache
          docker exec bodaboda-prod-app php artisan route:cache
          docker exec bodaboda-prod-app php artisan view:cache
          docker exec bodaboda-prod-app php artisan storage:link || true

      - name: Start nginx for production
        run: |
          mkdir -p /tmp/nginx-prod
          cat > /tmp/nginx-prod/default.conf << 'NGINXCONF'
          server {
              listen 80;
              index index.php index.html;
              root /var/www/public;
              location ~ \.php$ {
                  try_files $uri =404;
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass bodaboda-prod-app:9000;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param PATH_INFO $fastcgi_path_info;
              }
              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }
          }
          NGINXCONF
          docker stop bodaboda-prod-nginx 2>/dev/null || true
          docker rm bodaboda-prod-nginx 2>/dev/null || true
          docker run -d \
            --name bodaboda-prod-nginx \
            --network bodaboda-prod-net \
            -p 8000:80 \
            -v /tmp/nginx-prod/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine

      - name: Verify Production is running
        run: |
          echo "Verifying production deployment..."
          sleep 10

          if docker ps | grep -q bodaboda-prod-nginx; then
            echo "Nginx container is running"
          else
            echo "Nginx container failed to start"
            docker logs bodaboda-prod-nginx --tail 30 || true
            exit 1
          fi

          if docker ps | grep -q bodaboda-prod-app; then
            echo "App container is running"
          else
            echo "App container failed to start"
            docker logs bodaboda-prod-app --tail 30 || true
            exit 1
          fi

          if docker ps | grep -q bodaboda-prod-db; then
            echo "Database container is running"
          else
            echo "Database container failed to start"
            exit 1
          fi

          echo "============================================"
          echo "  PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "  Environment : PRODUCTION"
          echo "  App URL     : http://localhost:8000"
          echo "  Containers  : 3 running"
          echo "  Status      : HEALTHY"
          echo "============================================"

      - name: Collect production logs
        if: always()
        run: |
          echo "========== PRODUCTION LOGS =========="
          echo "--- Running containers ---"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
          echo "--- App logs ---"
          docker logs bodaboda-prod-app --tail 30 || true
          echo "--- Nginx logs ---"
          docker logs bodaboda-prod-nginx --tail 20 || true
          echo "--- Docker images (tagged) ---"
          docker images | grep bodaboda || true