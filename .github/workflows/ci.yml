name: BodaBoda Digital CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Docker Hub registry (Assignment 3 requirement)
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bodaboda-app

jobs:

  # ============================================================
  # JOB 1: BUILD & TEST (CI)
  # ============================================================
  test-and-build:
    name: Build, Test & Push to Docker Hub
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bodaboda_test
          MYSQL_USER: bodaboda_user
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Start Mosquitto MQTT Broker ───────────────────────
      - name: Start Mosquitto
        run: |
          docker run -d \
            --name mosquitto \
            -p 1883:1883 \
            --entrypoint /bin/sh \
            eclipse-mosquitto:2 \
            -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && \
                echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && \
                exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"

          echo "Waiting for Mosquitto to accept connections..."
          for i in $(seq 1 10); do
            if timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/1883' 2>/dev/null; then
              echo "Mosquitto ready on port 1883"
              break
            fi
            echo "Attempt $i — waiting..."
            sleep 2
          done

      # ── 3. Setup PHP ─────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_mysql, bcmath, gd, zip, redis
          coverage: xdebug
          tools: composer

      # ── 4. Install system tools ───────────────────────────────
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      # ── 5. Prepare .env ───────────────────────────────────────
      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure environment for CI
        run: |
          echo "DB_HOST=127.0.0.1"       >> .env
          echo "DB_PORT=3306"            >> .env
          echo "DB_DATABASE=bodaboda_test" >> .env
          echo "DB_USERNAME=root"        >> .env
          echo "DB_PASSWORD=root"        >> .env
          echo "MQTT_HOST=127.0.0.1"     >> .env
          echo "MQTT_PORT=1883"          >> .env
          echo "REDIS_HOST=127.0.0.1"    >> .env
          echo "REDIS_PORT=6379"         >> .env
          echo "CACHE_DRIVER=file"       >> .env
          echo "SESSION_DRIVER=file"     >> .env

      # ── 6. Wait for MySQL ─────────────────────────────────────
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -proot bodaboda_test -e "SELECT 1" &>/dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Attempt $i: Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      # ── 7. Install Composer dependencies ─────────────────────
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # ── 8. Setup Laravel ──────────────────────────────────────
      - name: Setup Laravel application
        run: |
          php artisan key:generate
          php artisan config:cache
          php artisan migrate --force
          php artisan db:seed --force
          php artisan storage:link

      # ── 9. Run PHPUnit Tests ──────────────────────────────────
      #    Pipeline STOPS here if tests fail (Task 6)
      - name: Run Tests
        run: php artisan test

      # ── 10. Run API Tests ─────────────────────────────────────
      - name: Run API Tests
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          echo "Testing API endpoint..."
          curl -v http://127.0.0.1:8000/ || true
          kill $SERVER_PID || true

      # ── 11. MQTT Connection Test ──────────────────────────────
      - name: MQTT Connection Test
        timeout-minutes: 2
        run: |
          echo "Testing MQTT broker connection..."
          php scripts/mqtt_test.php 127.0.0.1 1883

      # ── 12. Run Security Scan ─────────────────────────────────
      - name: Run Security Scan
        run: |
          composer require --dev enlightn/security-checker
          vendor/bin/security-checker security:check

      # ─────────────────────────────────────────────────────────
      # TASK 3 & 5: BUILD DOCKER IMAGE + TAG VERSIONS
      # ─────────────────────────────────────────────────────────

      # ── 13. Set up Docker Buildx ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 14. Login to Docker Hub ───────────────────────────────
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 15. Build Docker Image ────────────────────────────────
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:v1.0
          echo "Images built:"
          docker images | grep bodaboda-app

      # ── 16. Push to Docker Hub ────────────────────────────────
      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:v1.0
          echo "========================================"
          echo "  PUSHED TO DOCKER HUB SUCCESSFULLY"
          echo "  Image : ${{ env.DOCKER_IMAGE }}"
          echo "  Tags  : latest, v1.0"
          echo "========================================"

      # ── 17. Upload logs ───────────────────────────────────────
      - name: Upload test results and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            storage/logs/
            /tmp/laravel.log
          retention-days: 30

  # ============================================================
  # TASK 6: DEMONSTRATE FAILURE HANDLING
  # (Uncomment the step below, push once, then recomment)
  # ============================================================
  # To demonstrate: change "Run Tests" above to:
  #   run: exit 1
  # Push — pipeline stops before Docker Hub push.
  # Then restore and push again to show success.

  # ============================================================
  # JOB 2: STAGING DEPLOYMENT
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ── 1. Pull image FROM Docker Hub (not local build) ───────
      - name: Pull image from Docker Hub
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          echo "Pulled: ${{ env.DOCKER_IMAGE }}:latest"

      # ── 2. Create Docker network ──────────────────────────────
      - name: Create Docker network
        run: docker network create bodaboda-staging-net 2>/dev/null || true

      # ── 3. Start MySQL ────────────────────────────────────────
      - name: Start MySQL for staging
        run: |
          docker stop bodaboda-staging-db 2>/dev/null || true
          docker rm   bodaboda-staging-db 2>/dev/null || true
          docker run -d \
            --name bodaboda-staging-db \
            --network bodaboda-staging-net \
            -e MYSQL_DATABASE=bodaboda \
            -e MYSQL_USER=bodaboda_user \
            -e MYSQL_PASSWORD=root \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0

          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec bodaboda-staging-db mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 3
          done

      # ── 4. Start Mosquitto MQTT (staging) ─────────────────────
      - name: Start Mosquitto for staging
        run: |
          docker stop bodaboda-staging-mqtt 2>/dev/null || true
          docker rm   bodaboda-staging-mqtt 2>/dev/null || true
          docker run -d \
            --name bodaboda-staging-mqtt \
            --network bodaboda-staging-net \
            -p 1884:1883 \
            --entrypoint /bin/sh \
            eclipse-mosquitto:2 \
            -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && \
                echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && \
                exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"

      # ── 5. Start app container ────────────────────────────────
      - name: Start app container (staging)
        run: |
          docker stop bodaboda-staging-app 2>/dev/null || true
          docker rm   bodaboda-staging-app 2>/dev/null || true
          docker run -d \
            --name bodaboda-staging-app \
            --network bodaboda-staging-net \
            --user root \
            -e APP_ENV=staging \
            -e APP_DEBUG=true \
            -e APP_KEY=${{ secrets.APP_KEY }} \
            -e APP_URL=http://localhost:8080 \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=bodaboda-staging-db \
            -e DB_PORT=3306 \
            -e DB_DATABASE=bodaboda \
            -e DB_USERNAME=bodaboda_user \
            -e DB_PASSWORD=root \
            -e MQTT_HOST=bodaboda-staging-mqtt \
            -e MQTT_PORT=1883 \
            -e CACHE_DRIVER=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            -e LOG_CHANNEL=stderr \
            ${{ env.DOCKER_IMAGE }}:latest

          echo "Waiting for bodaboda-staging-app to be healthy..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Status}}' bodaboda-staging-app 2>/dev/null)
            if [ "$STATUS" = "running" ]; then
              echo "Container is running"
              break
            fi
            echo "Attempt $i: status=$STATUS — waiting..."
            sleep 2
          done

          STATUS=$(docker inspect --format='{{.State.Status}}' bodaboda-staging-app 2>/dev/null)
          if [ "$STATUS" != "running" ]; then
            echo "ERROR: Container failed to start (status=$STATUS)"
            docker logs bodaboda-staging-app --tail 30
            exit 1
          fi

          docker exec bodaboda-staging-app php artisan config:clear || true
          docker exec bodaboda-staging-app php artisan migrate --force || true
          docker exec bodaboda-staging-app php artisan storage:link || true

      # ── 6. Start Nginx ────────────────────────────────────────
      - name: Start nginx for staging
        run: |
          mkdir -p /tmp/nginx-staging
          cat > /tmp/nginx-staging/default.conf << 'NGINXCONF'
          resolver 127.0.0.11 ipv6=off;
          server {
              listen 80;
              index index.php index.html;
              root /var/www/public;
              set $upstream_app bodaboda-staging-app;
              location ~ \.php$ {
                  try_files $uri =404;
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass $upstream_app:9000;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param PATH_INFO $fastcgi_path_info;
              }
              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }
          }
          NGINXCONF

          docker stop bodaboda-staging-nginx 2>/dev/null || true
          docker rm   bodaboda-staging-nginx 2>/dev/null || true
          docker run -d \
            --name bodaboda-staging-nginx \
            --network bodaboda-staging-net \
            -p 8080:80 \
            -v /tmp/nginx-staging/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine

      # ── 7. Test MQTT in staging ───────────────────────────────
      - name: Test MQTT communication (staging)
        run: |
          echo "Testing MQTT publish/subscribe in staging..."
          docker exec bodaboda-staging-mqtt \
            mosquitto_pub -h localhost -t bodaboda/test -m "staging-deploy-ok" || true
          echo "MQTT publish test complete"

      # ── 8. Verify staging ─────────────────────────────────────
      - name: Verify Staging deployment
        run: |
          sleep 10
          for container in bodaboda-staging-nginx bodaboda-staging-app bodaboda-staging-db bodaboda-staging-mqtt; do
            if docker ps | grep -q $container; then
              echo "$container is running ✓"
            else
              echo "$container FAILED"
              docker logs $container --tail 30 || true
              exit 1
            fi
          done

          echo "============================================"
          echo "  STAGING DEPLOYMENT SUCCESSFUL"
          echo "  Image Source : Docker Hub"
          echo "  Image        : ${{ env.DOCKER_IMAGE }}:latest"
          echo "  App URL      : http://localhost:8080"
          echo "  MQTT         : localhost:1884"
          echo "  Containers   : 4 running"
          echo "  Status       : HEALTHY"
          echo "============================================"

      # ── 9. Logs & Monitoring ──────────────────────────────────
      - name: Application Logs & Monitoring — Staging
        if: always()
        run: |
          echo "================================================"
          echo "  DOCKER IMAGE TAGS EVIDENCE"
          echo "================================================"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}" \
            | grep -E "bodaboda|REPOSITORY" || true

          echo ""
          echo "================================================"
          echo "  CONTAINER STATUS"
          echo "================================================"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}" || true

          echo ""
          echo "--- App Logs ---"
          docker logs bodaboda-staging-app --tail 30 2>&1 || true

          echo ""
          echo "--- Nginx Logs ---"
          docker logs bodaboda-staging-nginx --tail 20 2>&1 || true

          echo ""
          echo "--- Resource Usage ---"
          docker stats --no-stream --format \
            "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" || true

  # ============================================================
  # APPROVAL GATE (Production requires manual approval)
  # ============================================================
  approval-gate:
    name: Awaiting Release Manager Approval
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-approval
    steps:
      - name: Awaiting approval
        run: |
          echo "========================================"
          echo "  STAGING VERIFIED"
          echo "  Waiting for approval before PRODUCTION"
          echo "========================================"

  # ============================================================
  # JOB 3: PRODUCTION DEPLOYMENT
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: approval-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ── 1. Pull image FROM Docker Hub ─────────────────────────
      - name: Pull image from Docker Hub
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          docker pull ${{ env.DOCKER_IMAGE }}:v1.0
          echo "Images pulled from Docker Hub"

      # ── 2. Create Docker network ──────────────────────────────
      - name: Create Docker network
        run: docker network create bodaboda-prod-net 2>/dev/null || true

      # ── 3. Start MySQL ────────────────────────────────────────
      - name: Start MySQL for production
        run: |
          docker stop bodaboda-prod-db 2>/dev/null || true
          docker rm   bodaboda-prod-db 2>/dev/null || true
          docker run -d \
            --name bodaboda-prod-db \
            --network bodaboda-prod-net \
            -e MYSQL_DATABASE=bodaboda \
            -e MYSQL_USER=bodaboda_user \
            -e MYSQL_PASSWORD=root \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0

          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec bodaboda-prod-db mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 3
          done

      # ── 4. Start Mosquitto MQTT (production) ──────────────────
      - name: Start Mosquitto for production
        run: |
          docker stop bodaboda-prod-mqtt 2>/dev/null || true
          docker rm   bodaboda-prod-mqtt 2>/dev/null || true
          docker run -d \
            --name bodaboda-prod-mqtt \
            --network bodaboda-prod-net \
            -p 1883:1883 \
            --entrypoint /bin/sh \
            eclipse-mosquitto:2 \
            -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && \
                echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && \
                exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"

      # ── 5. Start app container ────────────────────────────────
      - name: Start app container (production)
        run: |
          docker stop bodaboda-prod-app 2>/dev/null || true
          docker rm   bodaboda-prod-app 2>/dev/null || true
          docker run -d \
            --name bodaboda-prod-app \
            --network bodaboda-prod-net \
            --user root \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY=${{ secrets.APP_KEY }} \
            -e APP_URL=http://localhost:8000 \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=bodaboda-prod-db \
            -e DB_PORT=3306 \
            -e DB_DATABASE=bodaboda \
            -e DB_USERNAME=bodaboda_user \
            -e DB_PASSWORD=root \
            -e MQTT_HOST=bodaboda-prod-mqtt \
            -e MQTT_PORT=1883 \
            -e CACHE_DRIVER=file \
            -e SESSION_DRIVER=file \
            -e QUEUE_CONNECTION=sync \
            -e LOG_CHANNEL=stderr \
            ${{ env.DOCKER_IMAGE }}:latest

          echo "Waiting for bodaboda-prod-app to be healthy..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Status}}' bodaboda-prod-app 2>/dev/null)
            if [ "$STATUS" = "running" ]; then
              echo "Container is running"
              break
            fi
            echo "Attempt $i: status=$STATUS — waiting..."
            sleep 2
          done

          STATUS=$(docker inspect --format='{{.State.Status}}' bodaboda-prod-app 2>/dev/null)
          if [ "$STATUS" != "running" ]; then
            echo "ERROR: Container failed to start (status=$STATUS)"
            docker logs bodaboda-prod-app --tail 30
            exit 1
          fi

          docker exec bodaboda-prod-app php artisan config:clear || true
          docker exec bodaboda-prod-app php artisan migrate --force || true
          docker exec bodaboda-prod-app php artisan config:cache || true
          docker exec bodaboda-prod-app php artisan view:cache || true
          docker exec bodaboda-prod-app php artisan storage:link || true

      # ── 6. Start Nginx ────────────────────────────────────────
      - name: Start nginx for production
        run: |
          mkdir -p /tmp/nginx-prod
          cat > /tmp/nginx-prod/default.conf << 'NGINXCONF'
          resolver 127.0.0.11 ipv6=off;
          server {
              listen 80;
              index index.php index.html;
              root /var/www/public;
              set $upstream_app bodaboda-prod-app;
              location ~ \.php$ {
                  try_files $uri =404;
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass $upstream_app:9000;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param PATH_INFO $fastcgi_path_info;
              }
              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }
          }
          NGINXCONF

          docker stop bodaboda-prod-nginx 2>/dev/null || true
          docker rm   bodaboda-prod-nginx 2>/dev/null || true
          docker run -d \
            --name bodaboda-prod-nginx \
            --network bodaboda-prod-net \
            -p 8000:80 \
            -v /tmp/nginx-prod/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine

      # ── 7. Test MQTT in production ────────────────────────────
      - name: Test MQTT communication (production)
        run: |
          echo "Testing MQTT publish/subscribe in production..."
          docker exec bodaboda-prod-mqtt \
            mosquitto_pub -h localhost -t bodaboda/rides -m "rider-request-ok" || true
          echo "MQTT communication verified"

      # ── 8. Verify production ──────────────────────────────────
      - name: Verify Production deployment
        run: |
          sleep 10
          for container in bodaboda-prod-nginx bodaboda-prod-app bodaboda-prod-db bodaboda-prod-mqtt; do
            if docker ps | grep -q $container; then
              echo "$container is running ✓"
            else
              echo "$container FAILED"
              docker logs $container --tail 30 || true
              exit 1
            fi
          done

          echo "============================================"
          echo "  PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "  Image Source : Docker Hub"
          echo "  Image        : ${{ env.DOCKER_IMAGE }}:latest"
          echo "  App URL      : http://localhost:8000"
          echo "  MQTT         : localhost:1883"
          echo "  Containers   : 4 running"
          echo "  Status       : HEALTHY"
          echo "============================================"

      # ── 9. Final Logs & Monitoring ────────────────────────────
      - name: Application Logs & Monitoring — Production
        if: always()
        run: |
          echo "================================================"
          echo "  PRODUCTION: LOGS & MONITORING"
          echo "================================================"

          echo ""
          echo "--- [1] Running Containers ---"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}" || true

          echo ""
          echo "--- [2] App Logs ---"
          docker logs bodaboda-prod-app --tail 40 2>&1 || true

          echo ""
          echo "--- [3] Nginx Logs ---"
          docker logs bodaboda-prod-nginx --tail 20 2>&1 || true

          echo ""
          echo "--- [4] MySQL Logs ---"
          docker logs bodaboda-prod-db --tail 15 2>&1 || true

          echo ""
          echo "--- [5] Resource Usage ---"
          docker stats --no-stream --format \
            "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}" || true

          echo ""
          echo "--- [6] Docker Image Tags (Final Evidence) ---"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}\t{{.CreatedAt}}" \
            | grep -E "bodaboda|REPOSITORY" || true

          echo ""
          echo "================================================"
          echo "  MONITORING COMPLETE"
          echo "  Registry : Docker Hub"
          echo "  Tags     : latest, v1.0"
          echo "  Status   : HEALTHY"
          echo "================================================"