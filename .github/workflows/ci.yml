name: BodaBoda Digital CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bodaboda_test
          MYSQL_USER: bodaboda_user
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql, bcmath, gd, zip
          coverage: xdebug
          tools: composer

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure Database Environment
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=bodaboda_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -proot bodaboda_test -e "SELECT 1" &> /dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Attempt $i: Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Database
        run: |
          php artisan key:generate
          php artisan config:cache
          php artisan migrate --force
          php artisan db:seed --force

      - name: Create storage links
        run: php artisan storage:link

      - name: Run Tests
        run: php artisan test

      - name: Run API Tests
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          curl -v http://127.0.0.1:8000/ || true
          kill $SERVER_PID || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Security Scan
        run: |
          composer require --dev enlightn/security-checker
          vendor/bin/security-checker security:check

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            storage/logs/
            coverage/
          retention-days: 30

  deploy-staging:
    needs: test-and-build
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Staging
        run: |
          echo "Deploying to STAGING"

          # Stop and remove old stack if running
          docker compose -p bodaboda-staging down --remove-orphans 2>/dev/null || true

          # Free port 8080 if occupied
          fuser -k 8080/tcp 2>/dev/null || true
          sleep 2

          # Pull latest image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Write a staging docker-compose override that uses port 8080
          cat > /tmp/docker-compose.staging.yml << 'COMPOSE'
          services:
            app:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              container_name: bodaboda-staging-app
              restart: unless-stopped
              working_dir: /var/www
              environment:
                APP_ENV: staging
                APP_DEBUG: "false"
                APP_KEY: ${{ secrets.APP_KEY }}
                DB_CONNECTION: mysql
                DB_HOST: db
                DB_PORT: 3306
                DB_DATABASE: ${{ secrets.STAGING_DB_DATABASE }}
                DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
                DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

            db:
              image: mysql:8.0
              container_name: bodaboda-staging-db
              restart: unless-stopped
              environment:
                MYSQL_DATABASE: ${{ secrets.STAGING_DB_DATABASE }}
                MYSQL_USER: ${{ secrets.STAGING_DB_USERNAME }}
                MYSQL_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
                MYSQL_ROOT_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
              volumes:
                - bodaboda-staging-dbdata:/var/lib/mysql

            nginx:
              image: nginx:alpine
              container_name: bodaboda-staging-nginx
              restart: unless-stopped
              ports:
                - "8080:80"
              volumes:
                - ./:/var/www
                - ./nginx/conf.d/:/etc/nginx/conf.d/
              depends_on:
                - app

          volumes:
            bodaboda-staging-dbdata:
              driver: local
          COMPOSE

          docker compose -p bodaboda-staging -f /tmp/docker-compose.staging.yml up -d
          echo "Staging stack started"

      - name: Run Migrations on Staging
        run: |
          echo "Running migrations on staging..."
          sleep 15
          docker exec bodaboda-staging-app php artisan migrate --force || true

      - name: Verify Staging
        run: |
          echo "Waiting for nginx on port 8080..."

          # Retry for up to 60 seconds
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"

            # Accept 2xx or 3xx (Laravel may redirect / to /login)
            if [[ "$HTTP_CODE" =~ ^[23] ]]; then
              echo "Staging is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi

            # Dump logs midway to help debug
            if [ "$i" -eq 6 ]; then
              echo "--- Nginx logs ---"
              docker logs bodaboda-staging-nginx --tail 20 || true
              echo "--- App logs ---"
              docker logs bodaboda-staging-app --tail 20 || true
            fi

            sleep 5
          done

          echo "--- Final logs ---"
          docker logs bodaboda-staging-nginx --tail 30 || true
          docker logs bodaboda-staging-app --tail 30 || true
          echo "Staging failed to respond after 60 seconds"
          exit 1

  approval-gate:
    needs: deploy-staging
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-approval
    steps:
      - name: Wait for Approval
        run: echo "Waiting for Release Manager approval before production"

  deploy-production:
    needs: approval-gate
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Production
        run: |
          echo "Deploying to PRODUCTION"

          # Stop old stack
          docker compose -p bodaboda-prod down --remove-orphans 2>/dev/null || true

          # Free port 8000 if occupied (matches docker-compose.yml 8000:80)
          fuser -k 8000/tcp 2>/dev/null || true
          sleep 2

          # Pull latest image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Write production docker-compose override using port 8000:80 (from README)
          cat > /tmp/docker-compose.prod.yml << 'COMPOSE'
          services:
            app:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              container_name: bodaboda-app
              restart: unless-stopped
              working_dir: /var/www
              environment:
                APP_ENV: production
                APP_DEBUG: "false"
                APP_KEY: ${{ secrets.APP_KEY }}
                DB_CONNECTION: mysql
                DB_HOST: db
                DB_PORT: 3306
                DB_DATABASE: ${{ secrets.PROD_DB_DATABASE }}
                DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
                DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

            db:
              image: mysql:8.0
              container_name: bodaboda-db
              restart: unless-stopped
              environment:
                MYSQL_DATABASE: ${{ secrets.PROD_DB_DATABASE }}
                MYSQL_USER: ${{ secrets.PROD_DB_USERNAME }}
                MYSQL_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
                MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
              volumes:
                - bodaboda-dbdata:/var/lib/mysql

            nginx:
              image: nginx:alpine
              container_name: bodaboda-nginx
              restart: unless-stopped
              ports:
                - "8000:80"
              volumes:
                - ./:/var/www
                - ./nginx/conf.d/:/etc/nginx/conf.d/
              depends_on:
                - app

          volumes:
            bodaboda-dbdata:
              driver: local
          COMPOSE

          docker compose -p bodaboda-prod -f /tmp/docker-compose.prod.yml up -d
          echo "Production stack started"

      - name: Run Migrations on Production
        run: |
          echo "Running migrations on production..."
          sleep 15
          docker exec bodaboda-app php artisan migrate --force
          docker exec bodaboda-app php artisan config:cache
          docker exec bodaboda-app php artisan route:cache
          docker exec bodaboda-app php artisan view:cache

      - name: Verify Production
        run: |
          echo "Waiting for nginx on port 8000..."

          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"

            if [[ "$HTTP_CODE" =~ ^[23] ]]; then
              echo "Production is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi

            if [ "$i" -eq 6 ]; then
              echo "--- Nginx logs ---"
              docker logs bodaboda-nginx --tail 20 || true
              echo "--- App logs ---"
              docker logs bodaboda-app --tail 20 || true
            fi

            sleep 5
          done

          echo "--- Final logs ---"
          docker logs bodaboda-nginx --tail 30 || true
          docker logs bodaboda-app --tail 30 || true
          echo "Production failed to respond after 60 seconds"
          exit 1