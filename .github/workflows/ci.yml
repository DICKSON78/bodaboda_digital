name: BodaBoda Digital CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bodaboda_test
          MYSQL_USER: bodaboda_user
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql, bcmath, gd, zip
          coverage: xdebug
          tools: composer

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure Database Environment
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=bodaboda_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -proot bodaboda_test -e "SELECT 1" &> /dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Attempt $i: Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Database
        run: |
          php artisan key:generate
          php artisan config:cache
          php artisan migrate --force
          php artisan db:seed --force

      - name: Create storage links
        run: php artisan storage:link

      - name: Run Tests
        run: php artisan test
        continue-on-error: false

      - name: Run API Tests
        run: |
          # Start Laravel server for API testing
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          
          # Test basic endpoints
          curl -v http://127.0.0.1:8000/ || true
          
          # Kill the server
          kill $SERVER_PID || true
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Security Scan
        run: |
          # Install security scanner
          composer require --dev enlightn/security-checker
          
          # Run security check
          vendor/bin/security-checker security:check
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            storage/logs/
            coverage/
          retention-days: 30

  deploy-staging:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to local Docker staging
        run: |
          echo " Deploying to local Docker staging environment..."
          echo " CI pipeline completed successfully!"
          echo " Docker image built and ready for local deployment"
          echo ""
          echo " Local Staging Setup:"
          echo " 1. Pull the latest Docker image:"
          echo "    docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo ""
          echo " 2. Run staging environment locally:"
          echo "    docker-compose -f docker-compose.staging.yml up -d"
          echo ""
          echo " 3. Access local staging:"
          echo "    Application: http://localhost:8001"
          echo "    Grafana: http://localhost:3002"
          echo "    Database: localhost:3307"
          echo ""
          echo " What local staging does:"
          echo " - Pre-production testing on your machine"
          echo " - Tests new features before production"
          echo " - Validates Docker deployment locally"
          echo " - Performance testing on local hardware"
          echo " - User acceptance testing without cloud costs"
          echo " - Bug verification and fixes in isolated environment"
