name: BodaBoda Digital CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bodaboda_test
          MYSQL_USER: bodaboda_user
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysql, bcmath, gd, zip
          coverage: xdebug
          tools: composer

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure Database Environment
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=bodaboda_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -proot bodaboda_test -e "SELECT 1" &> /dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Attempt $i: Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Database
        run: |
          php artisan key:generate
          php artisan config:cache
          php artisan migrate --force
          php artisan db:seed --force

      - name: Create storage links
        run: php artisan storage:link

      - name: Run Tests
        run: php artisan test

      - name: Run API Tests
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          curl -v http://127.0.0.1:8000/ || true
          kill $SERVER_PID || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Security Scan
        run: |
          composer require --dev enlightn/security-checker
          vendor/bin/security-checker security:check

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            storage/logs/
            coverage/
          retention-days: 30

  deploy-staging:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Staging
        run: |
          echo "Deploying to STAGING on localhost"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker stop bodaboda-staging 2>/dev/null || true
          docker rm bodaboda-staging 2>/dev/null || true
          docker run -d --name bodaboda-staging -p 8080:80 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "Staging running at http://localhost:8080"

      - name: Verify Staging
        run: |
          echo "Verifying staging deployment"
          sleep 10
          if curl -f -s -o /dev/null http://localhost:8080; then
            echo "Staging is running"
          else
            echo "Staging failed to respond"
            exit 1
          fi

  approval-gate:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-approval
    steps:
      - name: Wait for Approval
        run: echo "Waiting for Release Manager approval before production"

  deploy-production:
    needs: approval-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Production
        run: |
          echo "Deploying to PRODUCTION on localhost"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker stop bodaboda-prod 2>/dev/null || true
          docker rm bodaboda-prod 2>/dev/null || true
          docker run -d --name bodaboda-prod -p 80:80 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "Production running at http://localhost"

      - name: Verify Production
        run: |
          echo "Verifying production deployment"
          sleep 10
          if curl -f -s -o /dev/null http://localhost; then
            echo "Production is running"
          else
            echo "Production failed to respond"
            exit 1
          fi