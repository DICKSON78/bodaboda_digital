services:

  # ─────────────────────────────────────────
  # APPLICATION (PHP-FPM)
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bodaboda-app
    container_name: bodaboda-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: aws-0-us-east-1.pooler.supabase.com
      DB_PORT: 6543
      DB_DATABASE: postgres
      DB_USERNAME: postgres.dumnsunvhhnrtffztvda
      DB_PASSWORD: Bodaboda2026
      DB_SSLMODE: require
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./:/var/www
      - ./.env.docker:/var/www/.env
    networks:
      - bodaboda-network
    depends_on:
      - redis
      - mosquitto

  # ─────────────────────────────────────────
  # NGINX WEB SERVER
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bodaboda-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - bodaboda-network
    depends_on:
      - app

  # ─────────────────────────────────────────
  # POSTGRESQL (Supabase - external)
  # ─────────────────────────────────────────
  # Database is hosted on Supabase externally.
  # Connection: postgresql://postgres.dumnsunvhhnrtffztvda:Bodaboda2026@aws-0-us-east-1.pooler.supabase.com:6543/postgres

  # ─────────────────────────────────────────
  # MQTT BROKER (Mosquitto)
  # ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bodaboda-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - bodaboda-network

  # ─────────────────────────────────────────
  # REDIS (Cache & Sessions)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bodaboda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bodaboda-network
    command: redis-server --appendonly yes --save 60 1

  # ─────────────────────────────────────────
  # PROMETHEUS (Metrics Collection)
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: bodaboda-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - bodaboda-network

  # ─────────────────────────────────────────
  # GRAFANA (Monitoring Dashboard)
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: bodaboda-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - bodaboda-network
    depends_on:
      - prometheus

  # ─────────────────────────────────────────
  # NODE EXPORTER (System Metrics)
  # ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: bodaboda-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - bodaboda-network

volumes:
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  bodaboda-network:
    driver: bridge